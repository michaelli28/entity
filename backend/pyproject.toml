[project]
name = "zstar-api"
version = "0.1.0"
description = "ZStar API — AI-powered founder profiling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.8.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.3.6",
    "anthropic>=0.52.0",
    "instructor[anthropic]>=1.8.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "svix>=1.62.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.57.0",
    "structlog>=25.5.0",
    "posthog>=7.11.0",
    "sqlglot>=30.4.2",
    "cachetools>=7.0.5",
    "apscheduler>=3.11.2",
    "resend>=2.27.0",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.26",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
    "asgi-lifespan>=2.1.0",
    "pytest-postgresql>=8.0.0",
]

[project.scripts]
dev = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"
start = "uvicorn src.main:app --host 0.0.0.0 --port 8000"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Disable pytest-postgresql by default; tests that need it can opt in via `-p postgresql`.
# Requires libpq (psycopg binary) which isn't guaranteed in all environments.
addopts = "-p no:postgresql"

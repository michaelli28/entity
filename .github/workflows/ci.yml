name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: cd backend && uv sync

      - name: Lint frontend
        run: pnpm --filter @zstar/web lint

      - name: Lint backend
        run: cd backend && uv run ruff check .

      - name: Typecheck frontend
        run: pnpm --filter @zstar/web exec tsc --noEmit

      - name: Typecheck backend
        run: cd backend && uv run pyright

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run @zstar/ui tests
        run: pnpm --filter @zstar/ui test

      - name: Run @zstar/web tests with coverage
        run: pnpm --filter @zstar/web exec vitest run --coverage

      - name: Ban `as any` on motion imports
        run: |
          if grep -rnE 'from ["'"'"']motion/react["'"'"']' apps/web/src packages/ui/src 2>/dev/null | grep -E '\bas\s+any\b'; then
            echo "::error::Found 'as any' on motion/react import — banned"; exit 1
          fi

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: cd backend && uv sync

      - name: Run tests
        run: cd backend && uv run pytest -v

  e2e-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @zstar/web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @zstar/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
